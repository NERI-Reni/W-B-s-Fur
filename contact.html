<!DOCTYPE html>
<html lang="en">

<head>
  <title>W&B's Fur</title>
  <link rel="stylesheet" href="p3.css">
</head>

<body>
  <header>
    <div class="brand">
      <img src="brand.png" alt="logo" width="200px">
    </div>
    <h1>W&B's Fur</h1>
    <nav>
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT US</a></li>
        <li><a href="contact.html" id="contact_us">CONTACT US</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="content">
      <h2>CONTACT US</h2>
      <form>
        <h3> CONTACT FORM</h3>
        <div class="form_name">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name"  required class="box" >
        </div>
        <div class="form_email">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email"  required class="box" >
        </div>
        <div class="form_number">
          <label for="phone">Contact No:</label>
          <input type="tel" id="phone" name="name" pattern="[0-9]{11}" maxlength="11" required class="box1" >
        </div>
        <div class="form_message">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="14" class="mbox"></textarea>
        </div>
        <div class="form_submit">
          <button class="sbox" onclick=" alert('Thank you for contacting us')">Submit</button>
        </div>
      </form>
    </div>
  </main>
  <footer>
    <div class="rights">
      <h3>All Right's Belong To The Owner</h3>
    </div>
    <div class="up">
      <a href=""><img src="up-arrow.png" alt="&uarr;" class="arrow"></a>
    </div>
  </footer>
</body>

</html>
